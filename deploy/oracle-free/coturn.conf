# Catro production TURN baseline for coturn 4.18.x.
# Runtime-only values (secret, realm, public/private address mapping and relay
# port bounds) are appended in tmpfs by compose.yaml and never stored here.

listening-port=3478
fingerprint
use-auth-secret
stale-nonce=600
no-multicast-peers
no-software-attribute
no-tls
log-file=stdout
simple-log

# Bound resource use for the small-room mesh deployment.
user-quota=8
total-quota=64
max-allocate-timeout=10
permission-lifetime=300
channel-lifetime=600

# TURN must never become a path to host/private infrastructure.
# Loopback is denied by coturn 4.18 by default unless allow-loopback-peers is
# explicitly enabled; these rules additionally block private/link-local IPv4.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
