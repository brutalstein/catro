name: rtc-diag
on:
  push:
    branches: [diag/rtc-mac]
jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/bootstrap.sh
      - run: cmake --preset macos-clang && cmake --build out/build/macos-clang --config Release --target catro_rtc_two_peer_test
      - name: Repeat two/five-person WebRTC test
        run: |
          exe=$(find out/build/macos-clang -name catro_rtc_two_peer_test -type f -perm -u+x | head -1)
          echo "cpus: $(sysctl -n hw.ncpu)"
          fails=0
          for i in $(seq 1 30); do
            start=$(date +%s)
            if ! "$exe" --order rand --rng-seed $i > run.log 2>&1; then
              fails=$((fails+1)); echo "::group::run $i FAILED ($(( $(date +%s)-start ))s)"; tail -c 20000 run.log; echo "::endgroup::"
            else
              echo "run $i ok ($(( $(date +%s)-start ))s)"
            fi
          done
          echo "failures: $fails/30"
