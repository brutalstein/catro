name: release-stable

# Catro's in-app updaters on Windows and macOS intentionally share /releases/latest.
# A stable release therefore publishes all platform assets together, even when the product
# feature in the release is Windows-only, so no installed client is ever pointed at a tag
# missing its architecture-specific package.
on:
  workflow_dispatch:
    inputs:
      service_url:
        description: Production Catro service (HTTPS origin)
        required: true
        default: https://51-170-186-61.sslip.io
      quick_package:
        description: Build macOS packages only, without tests or automatic publishing
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - CMakeLists.txt

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

env:
  DEFAULT_CATRO_SERVICE_URL: https://51-170-186-61.sslip.io

jobs:
  windows:
    if: ${{ !inputs.quick_package }}
    runs-on: windows-2025
    env:
      CATRO_SERVICE_URL: ${{ inputs.service_url || 'https://51-170-186-61.sslip.io' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites
        run: ./scripts/bootstrap.ps1
      - name: Build release
        run: ./scripts/build.ps1 -Configuration Release
      - name: Test release
        run: ./scripts/test.ps1 -Configuration Release
      - name: Package Windows
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Configuration Release -SkipBuild -ServiceUrl "$env:CATRO_SERVICE_URL"
      - name: Test Windows installer
        # The installer harness compiles a tiny launch probe with Windows PowerShell Add-Type.
        # PowerShell 7 rejects Add-Type -OutputType ConsoleApplication on current hosted runners.
        shell: powershell
        run: ./tests/installers/windows-installer-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            out/dist/Catro-windows-x64.zip
            out/dist/Catro-windows-x64.zip.sha256
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      CATRO_SERVICE_URL: ${{ inputs.service_url || 'https://51-170-186-61.sslip.io' }}
      CATRO_BUILD_TESTS: ${{ inputs.quick_package && 'OFF' || 'ON' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites
        run: scripts/bootstrap.sh
      - name: Build and test release
        if: ${{ !inputs.quick_package }}
        run: |
          scripts/build.sh Release
          scripts/test.sh Release
      - name: Package macOS
        run: scripts/package-macos.sh Release
      - name: Test installer and package
        if: ${{ !inputs.quick_package }}
        env:
          CATRO_TEST_BUILT_APP: out/build/macos-clang/Release/Catro.app
        run: tests/installers/macos-installer-test.sh
      - name: Launch and quit packaged app
        if: ${{ !inputs.quick_package }}
        run: |
          set -eu
          app_root=$(mktemp -d)
          ditto -x -k out/dist/Catro-macos-*.zip "$app_root"
          started=$(date +%s)
          open -n "$app_root/Catro.app"
          sleep 20
          pgrep -x Catro >/dev/null || { echo 'Catro exited during startup.' >&2; exit 1; }
          osascript -e 'tell application id "dev.catro.Catro" to quit'
          for _ in $(seq 1 20); do
            pgrep -x Catro >/dev/null || break
            sleep 1
          done
          if pgrep -x Catro >/dev/null; then echo 'Catro did not quit.' >&2; exit 1; fi
          for report in "$HOME"/Library/Logs/DiagnosticReports/Catro*; do
            [ -e "$report" ] || continue
            if [ "$(stat -f %m "$report")" -ge "$started" ]; then
              echo "Catro crashed: $report" >&2
              head -60 "$report" >&2
              exit 1
            fi
          done
          echo 'macOS lifecycle smoke passed.'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            out/dist/Catro-macos-*.zip
            out/dist/Catro-macos-*.zip.sha256
          if-no-files-found: error

  publish:
    if: ${{ !inputs.quick_package }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(Catro VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in             Catro-windows-x64.zip             Catro-windows-x64.zip.sha256             Catro-macos-arm64.zip             Catro-macos-arm64.zip.sha256             Catro-macos-x64.zip             Catro-macos-x64.zip.sha256; do
            test -s "release-assets/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          cat > release-notes.md <<'EOF'
          macOS voice join reliability.

          - macOS: voice starts only after the server admits you to the room, so "Voice connected" is no longer shown for a room that is still connecting.
          - macOS: a room that fails before admission shows "Room connection failed: <reason>"; a room the server never admits stops after 12 seconds with "Room connection timed out" instead of hanging on "Reconnecting...".
          - Includes the 0.3.15 fix: macOS verifies the secure signaling connection against the system root certificates, so Macs can join voice channels.
          EOF
          gh release create "$tag"             release-assets/Catro-windows-x64.zip             release-assets/Catro-windows-x64.zip.sha256             release-assets/Catro-macos-arm64.zip             release-assets/Catro-macos-arm64.zip.sha256             release-assets/Catro-macos-x64.zip             release-assets/Catro-macos-x64.zip.sha256             scripts/install-windows.ps1             scripts/uninstall-windows.ps1             scripts/install-macos.sh             --target "$GITHUB_SHA"             --title "Catro $version"             --notes-file release-notes.md
